include /etc/nginx/snippets/cors.nginx.snippet.conf;

server {
	listen                80 default_server;
	listen                [::]:80 default_server;

	# Server-level directives override the http-level ones from nginx.conf, so
	# these replace rather than duplicate the defaults. The files deliberately
	# live outside /var/log/nginx: the image symlinks the log names in there to
	# /dev/stdout, which would send the "file" copy to stdout a second time.
	access_log            /var/log/iintra/access.log;
	access_log            /dev/stdout;
	error_log             /var/log/iintra/error.log warn;
	error_log             /dev/stderr warn;

	include               /etc/nginx/snippets/iintra.nginx.snippet.conf;
}
