# Example configuration for a reverse proxy in front of the application
# container. The application serves its own static files, so everything is
# proxied straight through and nginx needs no access to the repository.

server {
	listen                80 default_server;
	listen                [::]:80 default_server;

	server_name           iintra.freekb.es darkintra.freekb.es;

	# Keep in sync with MAX_CONTENT_LENGTH in .public.env (banner uploads)
	client_max_body_size  12M;

	location / {
		proxy_pass        http://127.0.0.1:8000;
		proxy_redirect    off;
		proxy_set_header  Host $host;
		proxy_set_header  X-Real-IP $remote_addr;
		proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header  X-Forwarded-Proto $scheme;
		proxy_set_header  X-Forwarded-Host $server_name;
	}
}
