services:
  iintra_server:
    build: .
    container_name: improved_intra_server
    restart: always
    # tini as PID 1: reaps zombies and passes signals to entrypoint.sh
    init: true
    depends_on:
      iintra_database:
        condition: service_healthy
    env_file:
      - .private.env
    ports:
      # Set up a reverse proxy that points to this port in production
      - "8000:8000"
    volumes:
      - ./data/logs:/app/logs
      # User-uploaded banners must outlive the container
      - ./data/banners:/app/static/banners
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  iintra_database:
    image: postgres:16
    container_name: improved_intra_database
    restart: always
    env_file:
      # The same names the application uses, so each is written only once
      - .private.env
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
