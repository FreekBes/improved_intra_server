services:
  iintra_server:
    build: .
    container_name: improved_intra_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .private.env
    environment:
      # Deployment topology, not a secret: the database service name
      PSQL_HOST: db
    volumes:
      - ./logs/app:/app/logs
    networks:
      - iintra_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:stable
    container_name: improved_intra_nginx
    restart: always
    depends_on:
      - iintra_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/snippets:/etc/nginx/snippets
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./logs/nginx:/var/log/nginx
      - ./static:/usr/share/nginx/html/static
      # add volume for SSL certificates if needed
      #- ./nginx/certs:/etc/nginx/certs
    networks:
      - iintra_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16
    container_name: improved_intra_db
    restart: always
    environment:
      POSTGRES_USER: ${PSQL_USER:-postgres}
      POSTGRES_PASSWORD: ${PSQL_PASS:-postgres}
      POSTGRES_DB: ${PSQL_DB:-iintra}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - iintra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  iintra_network:
    driver: bridge
