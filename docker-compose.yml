services:
  iintra_server:
    build: .
    container_name: improved_intra_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .private.env
    environment:
      # Deployment topology, not a secret: the database service name
      PSQL_HOST: db
    ports:
      # Bound to loopback: run your own reverse proxy in front of this.
      # Use "8000:8000" instead if the proxy lives on another host.
      - "127.0.0.1:8000:8000"
    volumes:
      - app_logs:/app/logs
      # User-uploaded banners must outlive the container
      - banners:/app/static/banners
    networks:
      - iintra_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16
    container_name: improved_intra_db
    restart: always
    environment:
      POSTGRES_USER: ${PSQL_USER:-postgres}
      POSTGRES_PASSWORD: ${PSQL_PASS:-postgres}
      POSTGRES_DB: ${PSQL_DB:-iintra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - iintra_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PSQL_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  iintra_network:
    driver: bridge

volumes:
  app_logs:
  banners:
  pgdata:
