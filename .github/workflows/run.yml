name: Run Improved Intra Server

on:
  push:
    branches: [ main, github-actions ]
  pull_request:
    branches: [ '*' ]
  workflow_call:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create the private environment file
        run: cp .private.env.example .private.env

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Check that the application responds
        run: |
          curl http://127.0.0.1:8000/ --verbose --fail
          # Served by the application itself, no reverse proxy involved
          curl http://127.0.0.1:8000/favicon.ico --verbose --fail --output /dev/null

      - name: Print logs
        if: always()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
